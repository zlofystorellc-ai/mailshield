# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# You only fill MONGODB_URI (from MongoDB Atlas); the secrets are generated by Render.
services:
  - type: web
    name: mailshield-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste the Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ALLOW_ANY_EXTENSION_ORIGIN
        value: "true" # unpacked installs have per-machine IDs; set EXTENSION_ORIGIN once on the Web Store
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: none
      - key: ATLAS_VECTOR_SEARCH
        value: "false"
      - key: REPORT_THRESHOLD
        value: "3"
      - key: AUTO_ACTIVATE_THRESHOLD
        value: "10"
      - key: RUN_WORKER
        value: "true"
